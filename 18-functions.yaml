- name: functions
  hosts: local
  connection: local
  vars:
   technologies: Devops, Linux, Shell, Ansible #string
   #dictionary==map
   tags:
    Application: payment
    Environment: dev
   #list
   listTags:
   - key: Application
     value: payment
   - key: Environment
     value: dev

  tasks:
  - name: default variable
    ansible.builtin.debug:
     msg: "Hello, {{ name | default('Ramesh') }}"

   #convert string to list
  - name: convert string to list
    ansible.builtin.debug:
     msg: "Technologies are : {{ technologies | split(',') }}"

   #convert dict to list
  - name: convert dict to list
    ansible.builtin.debug:
     msg: "Tags are : {{ tags | dict2items }}"

   #list to dict
  - name: convert list to dict
    ansible.builtin.debug:
     msg: "tag map: {{ listTags | items2dict }}"
